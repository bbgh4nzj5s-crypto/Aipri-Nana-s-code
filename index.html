<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ffe7f7"><title>アイプリ ミックスコーデ 試作 v0.1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;background:#fff5fc;color:#604566}button,input,select{font:inherit}button{border:1px solid #eab6db;background:white;border-radius:12px;padding:7px 10px;color:#744875}button.active{background:#f6b8e0;border-color:#e783c8}header{height:45px;background:linear-gradient(90deg,#ffc3ed,#c2efff);display:flex;align-items:center;justify-content:space-between;padding:5px 10px;font-weight:700}main{height:calc(100dvh - 45px - 55px);display:flex;flex-direction:column;overflow:hidden}.tabs{display:flex;gap:5px;padding:6px}.tabs button{flex:1}.view{display:none;min-height:0;flex:1;flex-direction:column}.view.on{display:flex}.stages{display:flex;gap:5px;padding:3px 7px;flex:1;min-height:120px}.stage{position:relative;overflow:hidden;flex:1;background:white;border:2px solid #eacbe3;border-radius:14px;touch-action:none}.stage.selected{border-color:#e34eb6}.stage img.bg{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;pointer-events:none}.stage .piece{position:absolute;left:50%;top:50%;transform-origin:center;touch-action:none;user-select:none;-webkit-user-drag:none;max-width:none}.stage .piece.picked{outline:2px dashed #36a7f2;outline-offset:3px}.stage-label{position:absolute;top:5px;left:5px;font-size:11px;background:#ffffffb9;padding:3px 6px;border-radius:9px;z-index:20}.toolbar{display:flex;gap:5px;padding:4px 7px;align-items:center;overflow-x:auto}.toolbar button{white-space:nowrap;font-size:12px}.categories{display:flex;gap:3px;padding:5px 7px;overflow-x:auto}.categories button{white-space:nowrap;font-size:11px;padding:7px}.search{display:flex;gap:5px;padding:0 7px 5px}.search input{min-width:0;flex:1;border:1px solid #e9bad8;border-radius:9px;padding:8px}.items{height:27%;min-height:115px;overflow-y:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:6px 8px;background:white}.item{min-width:0;border:1px solid #f1d5e8;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;gap:3px}.item img{width:100%;height:54px;object-fit:contain}.item span{font-size:10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;width:100%;text-align:center}.panel{position:absolute;left:8px;right:8px;bottom:56px;max-height:68dvh;overflow-y:auto;background:#fff;border:2px solid #efb2dc;box-shadow:0 0 0 100vmax #0005;border-radius:16px;padding:12px;z-index:50;display:none}.panel.open{display:block}.panel-head{display:flex;justify-content:space-between;align-items:center}.control{display:grid;grid-template-columns:72px 1fr 45px;align-items:center;gap:6px;margin:9px 0;font-size:12px}.control input{width:100%}.row{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.row button{font-size:12px}.layer{padding:6px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:5px}.list{overflow:auto;padding:8px;flex:1}.entry{display:flex;align-items:center;gap:10px;background:white;padding:9px;margin:5px 0;border-radius:12px;border:1px solid #f1d2e9}.entry img{height:65px;width:65px;object-fit:contain}.entry div{flex:1}.entry small{display:block;color:#998398}footer{height:55px;display:flex;justify-content:space-around;align-items:center;background:white;border-top:1px solid #efcee3}footer button{font-size:12px}#fileBg{display:none}.muted{font-size:12px;color:#907b91;padding:8px} .folder{background:#fff;border:1px solid #f0c5e1;border-radius:10px;padding:9px;margin:6px 0} .folder summary{font-weight:700} @media(max-height:650px){.items{height:23%;min-height:85px}.item img{height:38px}.toolbar button{padding:5px}}
</style></head><body><header><span>♡ ミックスコーデ ♡</span><span style="font-size:11px">試作 Ver.0.1</span></header><main><div class="tabs"><button id="tabDress" class="active" onclick="showView('dress')">着せ替え</button><button id="tabCatalog" onclick="showView('catalog')">コーデ一覧</button><button id="tabSaved" onclick="showView('saved')">保存ファイル</button></div><section id="dress" class="view on"><div class="stages"><div class="stage selected" id="stage0" onclick="pickStage(0)"><span class="stage-label">左コーデ</span></div><div class="stage" id="stage1" onclick="pickStage(1)"><span class="stage-label">右コーデ</span></div></div><div class="toolbar"><button onclick="document.getElementById('fileBg').click()">背景を選ぶ</button><button onclick="openPanel()">⚙ 調整・レイヤー</button><button onclick="removeSelected()">外す</button><button onclick="undo()">↶</button><button onclick="redo()">↷</button><button onclick="saveMix()">保存</button><input id="fileBg" type="file" accept="image/*" onchange="setBg(event)"></div><div class="categories" id="categories"></div><div class="search"><input id="itemSearch" placeholder="アイテム名で検索" oninput="renderItems()"><select id="colorFilter" onchange="renderItems()"><option value="">全色</option><option>ピンク</option><option>水色</option><option>紫</option><option>黄色</option></select></div><div class="items" id="items"></div></section><section id="catalog" class="view"><div class="search"><input id="catalogSearch" placeholder="コーデ名で検索" oninput="renderCatalog()"><select id="catalogColor" onchange="renderCatalog()"><option value="">全色</option><option>ピンク</option><option>水色</option><option>紫</option><option>黄色</option></select></div><div class="list" id="catalogList"></div></section><section id="saved" class="view"><div class="toolbar"><button onclick="addFolder()">＋ フォルダ作成</button><button onclick="saveMix()">現在のコーデを保存</button></div><div class="list" id="savedList"></div></section></main><div class="panel" id="panel"><div class="panel-head"><b>♡ アイテム調整・レイヤー ♡</b><button onclick="closePanel()">完了 ✕</button></div><div id="panelContent"></div></div><footer><button onclick="showView('dress')">🎀 着せ替え</button><button onclick="showView('catalog')">♡ コーデ一覧</button><button onclick="showView('saved')">📁 保存</button></footer><script>
const cats=['アクセ','トップス','ボトムス','シューズ','ワンピース'];let activeSide=0,activeCat='アクセ',selected=null;const base=[{id:'a1',name:'リボンアクセ（サンプル）',cat:'アクセ',color:'ピンク',symbol:'🎀'},{id:'a2',name:'クラウンアクセ（サンプル）',cat:'アクセ',color:'黄色',symbol:'👑'},{id:'t1',name:'ピンクトップス（サンプル）',cat:'トップス',color:'ピンク',symbol:'👚'},{id:'t2',name:'水色トップス（サンプル）',cat:'トップス',color:'水色',symbol:'👕'},{id:'b1',name:'パープルボトムス（サンプル）',cat:'ボトムス',color:'紫',symbol:'🩳'},{id:'s1',name:'シューズ（サンプル）',cat:'シューズ',color:'ピンク',symbol:'👠'},{id:'w1',name:'ワンピース（サンプル）',cat:'ワンピース',color:'水色',symbol:'👗'}];
const icon=(s)=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160"><text x="80" y="115" font-size="105" text-anchor="middle">${s}</text></svg>`);base.forEach(x=>x.src=icon(x.symbol));const defaults=()=>({x:0,y:0,scale:100,angle:0,flip:false});const blank=()=>({layers:[],perItem:{},perCat:{},bg:''});let sides=[blank(),blank()],folders=[{id:'default',name:'マイコーデ',entries:[]}],history=[],future=[];function snapshot(){return JSON.stringify({sides,folders})}function checkpoint(){history.push(snapshot());if(history.length>50)history.shift();future=[]}function persist(){try{localStorage.setItem('mixV01',snapshot())}catch(e){alert('保存容量を超えました。背景画像を小さくしてください。')}}try{const v=JSON.parse(localStorage.getItem('mixV01'));if(v){sides=v.sides||sides;folders=v.folders||folders}}catch(e){}function undo(){if(!history.length)return;future.push(snapshot());const x=JSON.parse(history.pop());sides=x.sides;folders=x.folders;selected=null;renderAll()}function redo(){if(!future.length)return;history.push(snapshot());const x=JSON.parse(future.pop());sides=x.sides;folders=x.folders;selected=null;renderAll()}function showView(name){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===name));['dress','catalog','saved'].forEach((n,i)=>document.getElementById(['tabDress','tabCatalog','tabSaved'][i]).classList.toggle('active',n===name));if(name==='catalog')renderCatalog();if(name==='saved')renderSaved()}function pickStage(n){activeSide=n;selected=null;renderStages();renderPanel()}function selectCat(cat){activeCat=cat;renderCats();renderItems()}function renderCats(){document.getElementById('categories').innerHTML=cats.map(c=>`<button class="${activeCat===c?'active':''}" onclick="selectCat('${c}')">${c}</button>`).join('')}function renderItems(){const q=document.getElementById('itemSearch').value.trim(),color=document.getElementById('colorFilter').value;document.getElementById('items').innerHTML=base.filter(i=>i.cat===activeCat&&i.name.includes(q)&&(!color||i.color===color)).map(i=>`<button class="item" onclick="place('${i.id}')"><img src="${i.src}"><span>${i.name}</span></button>`).join('')||'<div class="muted">該当なし</div>'}function place(id){checkpoint();const item=base.find(i=>i.id===id),side=sides[activeSide],old=side.layers.find(l=>l.cat===item.cat);if(old){side.perItem[old.id]={...old.transform};side.perCat[old.cat]={...old.transform}}const tr=side.perItem[id]||side.perCat[item.cat]||defaults();side.layers=side.layers.filter(l=>l.cat!==item.cat);side.layers.push({id,cat:item.cat,transform:{...tr}});selected=id;renderAll()}function renderStages(){for(let n=0;n<2;n++){const el=document.getElementById('stage'+n),side=sides[n];el.classList.toggle('selected',n===activeSide);el.querySelectorAll('img').forEach(x=>x.remove());if(side.bg){const bg=document.createElement('img');bg.src=side.bg;bg.className='bg';el.append(bg)}side.layers.forEach((layer,idx)=>{const item=base.find(x=>x.id===layer.id);if(!item)return;const img=document.createElement('img');img.src=item.src;img.className='piece'+(n===activeSide&&selected===layer.id?' picked':'');img.style.width='58%';img.style.zIndex=idx+1;const t=layer.transform;img.style.transform=`translate(calc(-50% + ${t.x}px),calc(-50% + ${t.y}px)) rotate(${t.angle}deg) scale(${t.scale/100*(t.flip?-1:1)},${t.scale/100})`;img.addEventListener('pointerdown',e=>startDrag(e,n,layer.id));el.append(img)})}}let drag=null;function startDrag(e,n,id){e.stopPropagation();activeSide=n;selected=id;const layer=sides[n].layers.find(l=>l.id===id);if(!layer)return;checkpoint();drag={id,n,startX:e.clientX,startY:e.clientY,x:layer.transform.x,y:layer.transform.y};e.currentTarget.setPointerCapture(e.pointerId);e.currentTarget.addEventListener('pointermove',moveDrag);e.currentTarget.addEventListener('pointerup',endDrag,{once:true});e.currentTarget.addEventListener('pointercancel',endDrag,{once:true});renderPanel()}function moveDrag(e){if(!drag)return;const l=sides[drag.n].layers.find(x=>x.id===drag.id);if(!l)return;l.transform.x=Math.round(drag.x+e.clientX-drag.startX);l.transform.y=Math.round(drag.y+e.clientY-drag.startY);const t=l.transform;e.currentTarget.style.transform=`translate(calc(-50% + ${t.x}px),calc(-50% + ${t.y}px)) rotate(${t.angle}deg) scale(${t.scale/100*(t.flip?-1:1)},${t.scale/100})`}function endDrag(e){e.currentTarget.removeEventListener('pointermove',moveDrag);if(drag){const l=sides[drag.n].layers.find(x=>x.id===drag.id);if(l){sides[drag.n].perItem[l.id]={...l.transform};sides[drag.n].perCat[l.cat]={...l.transform}}}drag=null;renderAll()}function current(){return sides[activeSide].layers.find(l=>l.id===selected)}function removeSelected(){const l=current();if(!l)return;checkpoint();sides[activeSide].layers=sides[activeSide].layers.filter(x=>x!==l);selected=null;renderAll()}function openPanel(){document.getElementById('panel').classList.add('open');renderPanel()}function closePanel(){document.getElementById('panel').classList.remove('open')}function chooseLayer(id){selected=id;renderStages();renderPanel()}function changeVal(k,v){const l=current();if(!l)return;l.transform[k]=k==='flip'?v:Number(v);sides[activeSide].perItem[l.id]={...l.transform};sides[activeSide].perCat[l.cat]={...l.transform};renderStages();const o=document.getElementById('val_'+k);if(o)o.textContent=k==='scale'?v+'%':v}function renderPanel(){const el=document.getElementById('panelContent');if(!el)return;const l=current();let html='<div class="muted">レイヤーをタップすると、重なったアイテムも確実に選べます。</div>';html+=sides[activeSide].layers.map(x=>`<div class="layer"><span>${base.find(i=>i.id===x.id)?.name||x.id}</span><button class="${selected===x.id?'active':''}" onclick="chooseLayer('${x.id}')">選択</button></div>`).join('');if(l){html+='<hr>';[['x','移動 X',-180,180,1],['y','移動 Y',-250,250,1],['scale','サイズ',20,300,1],['angle','角度',-180,180,1]].forEach(([k,label,min,max,step])=>{html+=`<div class="control"><label>${label}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${l.transform[k]}" oninput="changeVal('${k}',this.value)"><span id="val_${k}">${l.transform[k]}${k==='scale'?'%':''}</span></div>`});html+=`<div class="row"><button onclick="changeVal('flip',${!l.transform.flip});renderPanel()">左右反転</button><button onclick="resetLayer()">調整リセット</button><button onclick="moveLayer(-1)">背面へ</button><button onclick="moveLayer(1)">前面へ</button></div>`}else html+='<div class="muted">アイテムを選択してください。</div>';el.innerHTML=html}function resetLayer(){const l=current();if(!l)return;checkpoint();l.transform=defaults();sides[activeSide].perItem[l.id]={...l.transform};sides[activeSide].perCat[l.cat]={...l.transform};renderAll()}function moveLayer(d){const l=current();if(!l)return;const a=sides[activeSide].layers,i=a.indexOf(l),j=Math.max(0,Math.min(a.length-1,i+d));checkpoint();a.splice(i,1);a.splice(j,0,l);renderAll()}function setBg(e){const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{checkpoint();sides[activeSide].bg=reader.result;renderAll()};reader.readAsDataURL(f);e.target.value=''}function addFolder(){const name=prompt('フォルダ名');if(!name?.trim())return;checkpoint();folders.push({id:'f'+Date.now(),name:name.trim(),entries:[]});renderAll()}function saveMix(){const name=prompt('ミックスコーデ名','新しいコーデ');if(!name?.trim())return;const folder=folders.length===1?folders[0]:folders[Number(prompt('保存先フォルダ番号：\n'+folders.map((f,i)=>i+': '+f.name).join('\n'),'0'))]||folders[0];checkpoint();folder.entries.push({id:'e'+Date.now(),name:name.trim(),sides:JSON.parse(JSON.stringify(sides)),created:new Date().toLocaleString('ja-JP')});renderAll();alert('保存しました')}function loadMix(fid,eid){const entry=folders.find(f=>f.id===fid)?.entries.find(e=>e.id===eid);if(!entry)return;checkpoint();sides=JSON.parse(JSON.stringify(entry.sides));selected=null;renderAll();showView('dress')}function deleteMix(fid,eid){if(!confirm('このコーデを削除しますか？'))return;checkpoint();const f=folders.find(f=>f.id===fid);f.entries=f.entries.filter(e=>e.id!==eid);renderAll()}function renderSaved(){document.getElementById('savedList').innerHTML=folders.map(f=>`<details class="folder" open><summary>📁 ${f.name} (${f.entries.length})</summary>${f.entries.map(e=>`<div class="entry"><div><b>${e.name}</b><small>${e.created}</small><small>${e.sides.flatMap(s=>s.layers.map(l=>base.find(i=>i.id===l.id)?.name||l.id)).join(' / ')}</small></div><button onclick="loadMix('${f.id}','${e.id}')">開く</button><button onclick="deleteMix('${f.id}','${e.id}')">削除</button></div>`).join('')||'<p class="muted">まだ保存されていません</p>'}</details>`).join('')}function renderCatalog(){const q=document.getElementById('catalogSearch').value,color=document.getElementById('catalogColor').value;document.getElementById('catalogList').innerHTML='<p class="muted">公式コーデの取得は未実装です。ここは公式データを確認してから追加します。現在のアイテムは操作テスト用サンプルです。</p>'+base.filter(x=>x.name.includes(q)&&(!color||x.color===color)).map(x=>`<div class="entry"><img src="${x.src}"><div><b>${x.name}</b><small>${x.cat} / ${x.color}</small><small>QR：未登録</small></div></div>`).join('')}function renderAll(){renderCats();renderItems();renderStages();renderPanel();renderSaved();renderCatalog();persist()}renderAll();
</script></body></html>
